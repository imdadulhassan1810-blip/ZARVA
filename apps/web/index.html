<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5b3df6" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='32' y2='32' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%236D54FB'/%3E%3Cstop offset='1' stop-color='%23FF6B4A'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Ccircle cx='13' cy='12.5' r='6.5' fill='white' fill-opacity='.95'/%3E%3Ccircle cx='19.5' cy='12.5' r='6.5' fill='white' fill-opacity='.55'/%3E%3Ccircle cx='16' cy='19' r='6.5' fill='white' fill-opacity='.8'/%3E%3C/svg%3E"
    />
    <title>OneApp — Everything, one app</title>
    <script>
      // Applied before first paint (and before React/Tailwind CSS loads) so switching
      // themes never causes a flash of the wrong one — kept in sync with src/lib/theme.ts.
      (function () {
        var stored = localStorage.getItem("oneapp-theme");
        var dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
